name: snapshot-predictions

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install --quiet requests gtfs-realtime-bindings
      - name: Take snapshot
        env:
          TRANSIT_511_TOKEN: ${{ secrets.TRANSIT_511_TOKEN }}
        run: python snapshot_predictions.py
      - name: Commit snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git pull --rebase origin main
          git push
