name: snapshot-predictions

# GitHub throttles high-frequency schedules (a */5 cron fired every ~20-40
# min in practice), so instead one job runs hourly and loops internally,
# snapshotting every 5 minutes and committing each one.
on:
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install --quiet requests gtfs-realtime-bindings
      - name: Snapshot every 5 minutes for the hour
        env:
          TRANSIT_511_TOKEN: ${{ secrets.TRANSIT_511_TOKEN }}
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 11); do
            python snapshot_predictions.py || true
            git add snapshots
            if git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"; then
              git pull --rebase -q origin main || true
              git push -q || true
            fi
            if [ "$i" -lt 11 ]; then sleep 300; fi
          done
